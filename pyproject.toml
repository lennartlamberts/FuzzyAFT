[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-aft-paper"
version = "1.0.0"
description = "Minimal reproduction package for Robust Survival Analysis via Fuzzy Interval Learning"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
  "lifelines==0.28.0",
  "numpy==1.26.4",
  "pandas==2.2.2",
  "pyarrow==15.0.2",
  "pycox==0.2.3",
  "PyYAML==6.0.1",
  "scikit-learn==1.3.2",
  "scikit-survival==0.22.2",
  "scipy==1.13.1",
  "torch==2.2.2",
  "torchtuples==0.2.2",
]
[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
fuzzy-aft-reproduce = "fuzzy_aft.experiments.paper:main"
fuzzy-aft-tables = "fuzzy_aft.tables:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
